name: flutter_app
description: A professional invoice app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة (State Management)
  provider: ^6.1.1

  # قاعدة البيانات المحلية
  sqflite: ^2.3.0
  path: ^1.8.3

  # توليد ومعاينة ملفات PDF
  pdf: ^3.10.7
  printing: ^5.11.0

  # أدوات مساعدة
  intl: ^0.20.3
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  path_provider: ^2.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/


fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 700